<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>中国象棋 · OTools 插件</title>
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /*
     * OTools 宿主桥（插件唯一需要写的 JS）。
     * ------------------------------------------------------------------
     * 宿主注入了两条能力通道，任一条通就算「在 OTools 里」：
     *   1. `window.otools` / `window.utools`：宿主包装 API（dialog.open/save + readHostFile/writeHostFile）。
     *   2. `window.__TAURI_INTERNALS__.invoke`：Tauri 原生 IPC（tools_webview_* 命令）。
     * 两条都不通（把 dist 拖进普通浏览器）就退回浏览器原生行为。
     *
     * 本插件用它做棋谱 JSON / FEN 的导入（openText）与导出（saveText）。
     */
    (function () {
      function base64ToBytes(b64) {
        var bin = atob(b64);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }
      function bytesToBase64(bytes) {
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function baseName(p) {
        var s = String(p || '');
        var i = Math.max(s.lastIndexOf('/'), s.lastIndexOf('\\'));
        return i >= 0 ? s.slice(i + 1) : s;
      }

      function wrapper() {
        var a = (typeof window !== 'undefined' && (window.otools || window.utools)) || null;
        return a && a.dialog && typeof a.dialog.open === 'function' && typeof a.readHostFile === 'function' ? a : null;
      }
      function tauriInvoke() {
        var candidates = [window];
        try { if (window.parent && window.parent !== window) candidates.push(window.parent); } catch (e) {}
        try { if (window.top && window.top !== window) candidates.push(window.top); } catch (e) {}
        for (var i = 0; i < candidates.length; i++) {
          var t = candidates[i] && candidates[i].__TAURI_INTERNALS__;
          if (t && typeof t.invoke === 'function') return t.invoke.bind(t);
        }
        return null;
      }
      function hostReady() { return !!wrapper() || !!tauriInvoke(); }
      function fail(msg) { return Promise.reject(new Error(msg)); }

      function readHostFile(path) {
        var a = wrapper();
        if (a) return a.readHostFile(path);
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 宿主不可用');
        return invoke('tools_webview_read_file', { path: path });
      }
      function writeHostFile(path, dataBase64) {
        var invoke = tauriInvoke();
        if (invoke) {
          return invoke('tools_webview_write_file', { request: { path: path, dataBase64: dataBase64 } }).catch(function (e) {
            var a = wrapper();
            if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
            throw e;
          });
        }
        var a = wrapper();
        if (a && typeof a.writeHostFile === 'function') return a.writeHostFile({ path: path, dataBase64: dataBase64 });
        return fail('OTools 宿主不可用');
      }
      function pickOpenPath(filters) {
        var a = wrapper();
        if (a) return a.dialog.open({ directory: false, multiple: false, title: '打开文件', filters: filters }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 打开文件对话框不可用');
        return invoke('tools_webview_pick_files', { options: { multiple: false, title: '打开文件', filters: filters } }).then(function (files) {
          var list = Array.isArray(files) ? files : (files ? [files] : []);
          var first = list[0];
          return first ? (typeof first === 'string' ? first : (first.path || null)) : null;
        });
      }
      function pickSavePath(defaultPath) {
        var a = wrapper();
        if (a) return a.dialog.save({ title: '保存文件', defaultPath: defaultPath, filters: [{ name: '棋谱', extensions: ['json'] }] }).then(function (p) {
          return (p && typeof p === 'string') ? p : (p && p.path ? p.path : null);
        });
        var invoke = tauriInvoke();
        if (!invoke) return fail('OTools 保存对话框不可用');
        var sp = String(defaultPath || '').match(/^(.*[\\/])?([^\\/]+)$/);
        return invoke('tools_webview_pick_save_path', {
          options: { title: '保存文件', suggestedName: sp ? sp[2] : defaultPath, directory: sp ? sp[1].replace(/[\\/]+$/, '') : undefined, filters: [{ name: '棋谱', extensions: ['json'] }] },
        }).then(function (meta) { return meta ? (typeof meta === 'string' ? meta : (meta.path || null)) : null; });
      }

      // 暴露给页面其它脚本的统一桥。
      window.otoolsPlugin = {
        available: function () { return hostReady(); },
        theme: function () {
          var cl = document.documentElement && document.documentElement.classList;
          if (!cl) return '';
          if (cl.contains('dark')) return 'dark';
          if (cl.contains('light')) return 'light';
          return '';
        },
        language: function () {
          try {
            return (window.__OTOOLS_LOCALE__ && window.__OTOOLS_LOCALE__.locale) ||
              (document.documentElement && document.documentElement.lang) ||
              (typeof navigator !== 'undefined' && navigator.language) || '';
          } catch (e) { return ''; }
        },
        openText: function (filters) {
          if (!hostReady()) return fail('OTools 打开文件对话框不可用');
          return pickOpenPath(filters || [{ name: '文本', extensions: ['txt', 'json', 'md'] }]).then(function (path) {
            if (!path) return null;
            return readHostFile(path).then(function (file) {
              var dataBase64 = (file && file.dataBase64) || '';
              return { name: (file && file.name) || baseName(path), path: path, text: atob(dataBase64) };
            });
          });
        },
        saveText: function (name, text) {
          if (!hostReady()) return fail('OTools 保存对话框不可用');
          return pickSavePath(name).then(function (path) {
            if (!path) return null;
            return writeHostFile(path, bytesToBase64(new TextEncoder().encode(text))).then(function () { return path; });
          });
        },
      };
    })();
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-logo" src="logo.svg" alt="">
      <h1>中国象棋</h1>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="play">对弈</button>
      <button class="tab" data-tab="replay">排盘</button>
      <button class="tab" data-tab="edit">摆盘</button>
    </nav>
  </header>

  <main class="layout">
    <section class="board-area">
      <div class="board-wrap" id="boardWrap">
        <canvas id="board"></canvas>
      </div>
    </section>

    <aside class="panel">
      <!-- 对弈 -->
      <div class="panel-page active" id="panel-play">
        <div class="btn-row">
          <select id="playMode" title="对弈模式">
            <option value="pvp">模式：双人对弈</option>
            <option value="ai-red">人机 · 我执红（红先）</option>
            <option value="ai-black">人机 · 我执黑（AI 红先）</option>
          </select>
          <select id="playLevel" title="电脑难度（仅人机模式）" hidden>
            <option value="easy">难度：易</option>
            <option value="normal" selected>难度：中</option>
            <option value="hard">难度：难</option>
          </select>
        </div>
        <div class="status-card" id="playStatus">红方行棋</div>
        <div class="btn-row">
          <button id="btnUndo">悔棋</button>
          <button id="btnRestart">重新开始</button>
        </div>
        <div class="btn-row">
          <button id="btnImportGame">导入棋谱</button>
          <button id="btnExportGame">导出对局</button>
        </div>
        <div class="move-list" id="playMoveList"></div>
        <div class="hint">点击己方棋子后点击高亮落点走子；对局进度自动保存。选择「人机」模式可电脑对弈，悔棋一次撤 AI+玩家两步。</div>
      </div>

      <!-- 排盘 -->
      <div class="panel-page" id="panel-replay">
        <div class="status-card" id="replayStatus">选择一局名局开始打谱</div>
        <div class="game-list" id="gameList"></div>
        <div class="btn-row">
          <button id="rpFirst" title="回到初始">⏮ 首</button>
          <button id="rpPrev">上一</button>
          <button id="rpNext">下一</button>
          <button id="rpLast" title="到最后">末 ⏭</button>
          <button id="rpPlay">▶ 自动</button>
          <select id="rpSpeed" title="自动播放速度">
            <option value="2200">慢</option>
            <option value="1200" selected>中</option>
            <option value="500">快</option>
          </select>
        </div>
        <div class="move-list clickable" id="replayMoveList"></div>
        <div class="comment-box" id="replayComment">评注会显示在这里。</div>
      </div>

      <!-- 摆盘 -->
      <div class="panel-page" id="panel-edit">
        <div class="status-card" id="editStatus">选择棋子后点击棋盘放置；点击已有棋子可替换。</div>
        <div class="palette" id="palette"></div>
        <div class="btn-row">
          <button id="edClear">清空</button>
          <button id="edInitial">初始局面</button>
          <button id="edStart">从此局面开始对弈</button>
        </div>
        <div class="btn-row">
          <button id="edImportFen">导入 FEN</button>
          <button id="edCopyFen">复制当前 FEN</button>
        </div>
        <div class="fen-box" id="fenBox"></div>
        <div class="hint">校验项：双方有王且在九宫、无照面、士相立足点、兵不过后场、子力数量上限。</div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
